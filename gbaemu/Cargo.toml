[package]
name = "gbaemu"
version = "0.1.0"
edition = "2021"
default-run = "gbaemu"


[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
gbaemu-core = { version = "0.1.0", path = "../gbaemu-core" }
colorable = "0.1.4"
minifb = "0.27.0"
image = "0.25.5"
minifb_fonts = "0.1.3"
ibm437 = { version = "0.4.0", features = ["framebuffer"] }
